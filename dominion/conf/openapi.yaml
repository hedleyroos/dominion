    /access/domain/permission/{user_id}/{domain_id}/{permission}:
        get:
            tags:
                - Access
            summary: Return an Access Result
            description:
                Return an Access Result. Only users who have the `Make API call` permission on the domain
                may make this call.
            parameters:
                - name: user_id
                  in: path
                  description: User ID
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: domain_id
                  in: path
                  description: Domain ID
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: permission
                  in: path
                  description: Permission
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Return an Access Result
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccessResult"
                "400":
                    description: Bad request (invalid UUID or domain not found)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Caller lacks check_access permission on the domain
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /access/domain/permissions/{user_id}/{domain_id}:
        get:
            tags:
                - Access
            summary: Return all effective permissions a user has on a domain
            description:
                Introspection — return the full set of permission codes the user
                effectively holds on the domain (direct plus inherited). Only users
                who have the `check_access` permission on the domain may make this call.
            parameters:
                - name: user_id
                  in: path
                  description: User ID
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: domain_id
                  in: path
                  description: Domain ID
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                "200":
                    description: The user's effective permissions on the domain.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EffectivePermissions"
                "400":
                    $ref: "#/components/responses/ValidationError"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

    /access/resource/permission/{user_id}/{resource_id}/{permission}:
        get:
            tags:
                - Access
            summary: Return an Access Result
            description:
                Return an Access Result. Only users who have the `Make API call` permission on the resource's resource
                may make this call.
            parameters:
                - name: user_id
                  in: path
                  description: User ID
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: resource_id
