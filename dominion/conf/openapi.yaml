                  schema:
                    type: string
                    format: uuid
                - name: permission
                  in: path
                  description: Permission
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Return an Access Result
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccessResult"
                "400":
                    description: Bad request (invalid UUID or resource not found)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Caller lacks check_access permission on the resource
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

components:

    securitySchemes:

        basic:
            type: http
            scheme: basic
            x-basicInfoFunc: dominion.api.auth.basic_auth

        api_key:
            type: apiKey
            name: X-Auth
            in: header
            x-apikeyInfoFunc: dominion.api.auth.apikey_auth

    responses:

        # Reusable error responses. Every authenticated operation can return 401/403;
        # single-item operations can return 404; rate-limited endpoints return 429;
        # unique-constrained creates (role/permission assignments) can return 409.
        Unauthorized:
            description: Authentication failed or the account is inactive.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        Forbidden:
            description: The authenticated user lacks the required permission.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        NotFound:
            description: The requested item does not exist.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        Conflict:
            description: The item already exists (unique constraint).
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        TooManyRequests:
            description: Rate limit exceeded.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        ValidationError:
            description: Invalid input.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"

    schemas:

        ErrorResponse:
            type: object
            properties:
                message:
                    type: string
            # Field-level validation errors are returned as {field: [messages...]} , so
            # additional properties may be either a string or an array of strings.
            additionalProperties:
                oneOf:
                    - type: string
                    - type: array
                      items:
                          type: string

        ######
        # User
        ######

        User:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    readOnly: true
                username:
                    type: string
                    maxLength: 256
                email:
                    type: string
                    maxLength: 254
                    format: email
                first_name:
                    type: string
                    maxLength: 150
                last_name:
                    type: string
                    maxLength: 150
                password:
                    type: string
                    maxLength: 150
                api_key:
                    type: string
                    readOnly: true
                domains:
                    type: array
                    readOnly: true
                    items:
                        $ref: '#/components/schemas/Domain'
            additionalProperties: false

        RegisterUser:
            type: object
            required:
                - username
                - email
                - password
            properties:
                username:
                    type: string
                    maxLength: 150
                email:
                    type: string
                    maxLength: 255
                    format: email
                first_name:
                    type: string
                    maxLength: 150
                last_name:
                    type: string
                    maxLength: 150
                password:
                    type: string
                    maxLength: 150
            additionalProperties: false

        LoginUser:
            type: object
            required:
                - email
                - password
            properties:
                email:
                    type: string
                    format: email
                    maxLength: 255
                password:
                    type: string
                    maxLength: 150
            additionalProperties: false

        Domain:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    readOnly: true
                title:
                    type: string
                    maxLength: 256
                parent:
                    type: string
                    format: uuid
                    description:
                        Domains may form a tree structure. An empty parent sets this domain
                        as a root domain.
            additionalProperties: false

        NewDomain:
            allOf:
                - $ref: '#/components/schemas/Domain'
                - required:
                    - title

        Resource:
            type: object
            required:
                - urn
            properties:
                id:
                    type: string
                    format: uuid
                    readOnly: true
                urn:
                    type: string
                    maxLength: 256
                    description:
                        A globally unique identifier that is generated by a client. It enables searching on
                        a field under the client's control, unlike ID. Create your own secret prefix
                        and use a pattern like
                        `my-secret-prefix:order:the-order-id`.
                parent:
                    type: string
                    format: uuid
                    description:
                        Resources may form a tree structure. An empty parent sets this resource
                        as a root resource.
                domain:
                    type: string
                    format: uuid
            additionalProperties: false

        Role:
            type: object
            properties:
                title:
                    type: string
                code:
                    type: string
                    maxLength: 64
                    description:
                        A human readable code, eg, `sales-manager`.
                domain:
                    type: string
                    format: uuid
                    description:
                        A role may only belong to a root domain.
            additionalProperties: false

        NewRole:
            allOf:
                - $ref: '#/components/schemas/Role'
                - required:
                    - title
                    - code
                    - domain
        UpdateRole:
            allOf:
                - $ref: '#/components/schemas/Role'
            properties:
                domain:
                    readOnly: true

        Permission:
            type: object
            properties:
                title:
                    type: string
                code:
                    type: string
                    maxLength: 64
                    description:
                        A human readable code, eg, `view-invoices`.
                domain:
                    type: string
                    format: uuid
                    description:
                        A permission may only belong to a root domain.
            additionalProperties: false

        NewPermission:
            allOf:
                - $ref: '#/components/schemas/Permission'
                - required:
                    - title
                    - code
                    - domain

        UpdatePermission:
            allOf:
                - $ref: '#/components/schemas/Permission'
            properties:
                domain:
                    readOnly: true

        UserDomainRole:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    readOnly: true
                user:
                    type: string
                    format: uuid
                domain:
                    type: string
                    format: uuid
                role:
                    type: string
                    maxLength: 64
                    description:
                        The role code, eg. `owner`.
            additionalProperties: false

        NewUserDomainRole:
            allOf:
                - $ref: '#/components/schemas/UserDomainRole'
                - required:
                    - user
                    - domain
                    - role

        DomainRolePermission:
            type: object
            properties:
                id:
                    type: integer
                    readOnly: true
                domain:
                    type: string
                    format: uuid
                role:
                    type: string
                    maxLength: 64
                    description:
                        The role code, eg. `owner`.
                permission:
                    type: string
                    maxLength: 64
                    description:
                        The permission code, eg. `read`.
                inherit:
                    type: boolean
                    default: true
            additionalProperties: false

        UpdateDomainRolePermission:
            allOf:
                - $ref: '#/components/schemas/DomainRolePermission'
            properties:
                domain:
                    readOnly: true

        UserResourceRole:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    readOnly: true
                user:
                    type: string
                    format: uuid
                resource:
                    type: string
                    format: uuid
                role:
                    type: string
                    maxLength: 64
                    description:
                        The role code, eg. `owner`.
            additionalProperties: false

        NewUserResourceRole:
            allOf:
                - $ref: '#/components/schemas/UserResourceRole'
                - required:
                    - user
                    - resource
                    - role

        ResourceRolePermission:
            type: object
            properties:
                id:
                    type: integer
                    readOnly: true
                resource:
                    type: string
                    format: uuid
                role:
                    type: string
                    maxLength: 64
                    description:
                        The role code, eg. `owner`.
                permission:
                    type: string
                    maxLength: 64
                    description:
                        The permission code, eg. `read`.
                inherit:
                    type: boolean
                    default: true
            additionalProperties: false

        UpdateResourceRolePermission:
            allOf:
                - $ref: '#/components/schemas/ResourceRolePermission'
            properties:
                resource:
                    readOnly: true

        AccessResult:
            type: object
            properties:
                result:
                    type: boolean
                    readOnly: true
                message:
                    type: string
            additionalProperties: false

        EffectivePermissions:
            type: object
            properties:
                user:
                    type: string
                    format: uuid
                    readOnly: true
                domain:
                    type: string
                    format: uuid
                    readOnly: true
                permissions:
                    type: array
                    items:
                        type: string
                    readOnly: true
            additionalProperties: false
