openapi: 3.0.3

info:
    title: Dominion REST APIs
    description: Dominion REST APIs
    version: "1.0.0"

servers:
    - url: /api/v1.0
      description: Rest Server showing Swagger and Connexion capability

security:
    - basic: []
    - api_key: []

paths:

    ######
    # User
    ######

    /user/register:
        post:
            security: []
            tags:
                - User
            summary: Register a new user
            description: Register a new user. An activation email is sent to the user email address.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterUser"
            responses:
                "201":
                    description: User registered successfully.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                "422":
                    description: Invalid input.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    $ref: "#/components/responses/TooManyRequests"

    /user/login:    
        post:
            security: []
            tags:
                - User
            summary: Login user
            description: Login a user with email and password
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginUser"
            responses:
                "200":
                    description: User logged in successfully.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                "401":
                    description: Invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    $ref: "#/components/responses/TooManyRequests"

    /user/by-api-key/{api_key}:
        parameters:
            - name: api_key
              in: path
              required: true
              schema:
                  type: string
                  format: uuid
              description: The API key of the user
        get:
            security: []
            tags:
                - User
            summary: Get user by API key
            description: Get user details using their API key
            responses:
                "200":
                    description: User details retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                "401":
                    description: User not active
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    description: User not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    $ref: "#/components/responses/TooManyRequests"
    /user:

        post:
            tags:
                - User
            summary: Create a new User
            description:
                Create a new User
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/User"
            responses:
                "201":
                    description: User created successfully

