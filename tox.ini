[tox]
envlist =
    app,app-postgres,api,api-postgres

[testenv]
basepython = python3.12


[testenv:app]
deps = -r requirements.txt
setenv =
    CELERY_ALWAYS_EAGER=True
commands = pytest dominion --ignore=dominion/api {posargs:-n auto}

[testenv:app-postgres]
deps = -r requirements.txt
setenv =
    DATABASE_URL=postgresql://test:test@localhost:5432/dominion_test
    CELERY_ALWAYS_EAGER=True
commands = pytest dominion --ignore=dominion/api {posargs:-n auto}

[testenv:api]
deps = -r requirements.txt
setenv =
    CELERY_ALWAYS_EAGER=True
commands = pytest dominion/api {posargs:-n auto}

[testenv:api-postgres]
deps = -r requirements.txt
setenv =
    DATABASE_URL=postgresql://test:test@localhost:5432/dominion_test
    CELERY_ALWAYS_EAGER=True
commands = pytest dominion/api {posargs:-n auto}

# Query-count / cache regression tests only (fast). Selects the `perf`-marked suite.
[testenv:perf]
deps = -r requirements.txt
setenv =
    CELERY_ALWAYS_EAGER=True
commands = pytest dominion -m perf {posargs:-p no:xdist}

# Full load-test smoke against a live server. Not run by default; requires a running
# Dominion server (--base-url) and a perf database. Example:
#   tox -e perfload -- setup --scale small
#   tox -e perfload -- run --scale small --baseline perf/baseline-small.json --check
[testenv:perfload]
deps = -r requirements.txt
passenv = DATABASE_URL, MEMCACHED_LOCATION, MEMCACHED_KEY_PREFIX, SECRET_KEY
commands = python perf/perfload.py {posargs:run --scale small}
